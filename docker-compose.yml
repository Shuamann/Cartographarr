services:
  cartographarr:
    build: .
    image: cartographarr:latest
    container_name: cartographarr
    restart: unless-stopped

    # Unraid's appdata is owned by nobody:users. Running as that pair keeps the
    # container off root without the volume going read-only on it.
    user: "99:100"

    ports:
      # 6277 = "MAPS" on a phone keypad, and clear of the usual
      # self-hosted stack (Sonarr 8989, Radarr 7878, Tautulli 8181,
      # Bazarr 6767, Prowlarr 9696, Seerr 5055, Tdarr 8265 and friends).
      - "6277:6277"

    volumes:
      - /mnt/user/appdata/cartographarr:/data

      # Only needed to tidy a file's tracks from the Library page. Mount the
      # shares at the paths Plex already reports and there is nothing else to
      # configure; where they differ, set media_path_map in Settings. Read
      # write, because tidying replaces the file it tidied.
      # - /mnt/user/movies:/movies
      # - /mnt/user/tv:/tv

    # One secrets file, shared with local dev. Anything set here wins over the
    # UI and renders read-only in Settings; omit a key entirely to let the UI
    # own it and persist to the database. See app/settings_store.py.
    env_file:
      - backend/.env

    environment:
      # Explicit, and last word: env_file carries DATA_DIR=./data for running
      # outside a container, which would be wrong in here.
      DATA_DIR: /data
      TZ: ${TZ:-America/Chicago}
