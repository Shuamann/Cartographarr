[project]
name = "cartographarr"
version = "0.67.0"
description = "Tautulli geo-intelligence and Plex access control"
requires-python = ">=3.12"

# Deps get added as their phase lands. Nothing here for a feature that
# doesn't exist yet: plexapi (sharing), apprise (notify), argon2 (local auth)
# arrive with phases 10, 12, 13.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28",
    "apscheduler>=3.10",
    "geoip2>=4.8",
    "argon2-cffi>=23.1",
    "apprise>=1.9",
    "python-multipart>=0.0.12",
    "plexapi>=4.16",
    # Not used directly. Apprise pulls it in through requests-oauthlib, and
    # 3.3.1 carries PYSEC-2026-4114, so the floor is set here rather than
    # waiting for apprise to raise its own.
    "oauthlib>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-xdist>=3.8", "respx>=0.21", "ruff>=0.8", "pip-audit>=2.7"]

# Without this, setuptools' flat-layout autodiscovery sees app/ alongside
# data/ (the runtime volume) and refuses to guess. Only app/ is the package.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies, queries and bodies as default arguments. That
# is the framework's own shape, not a mistake to be rewritten.
"app/routers/*.py" = ["B008"]
"app/auth/*.py" = ["B008"]
"app/privacy.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -n here on purpose. Every test builds its own app and database, about
# 160 MB a worker, so a full run at -n auto is thirty two processes and five
# gigabytes. That is the right trade on a build machine and a rude one on the
# desktop this is written on, and it makes a single file slower rather than
# faster: 9 seconds against 8, because starting the workers costs more than
# they save. Ask for it when you want it:
#
#   pytest -n 8     the whole suite in about a minute, roughly 1.3 GB
#   pytest -n auto  as fast as the machine goes, and as much of it as it has
#
# Measured on a 32 core machine: 326 s serial, 66 s at 8, 40 s at 24, and no
# better above that.
